spring:
  application:
    name: mira

  # Los valores por omision permiten clonar y levantar sin configurar nada (PNF-16).
  # La aplicacion no lee .env: ese archivo es para Docker Compose. Para sobrescribir,
  # exporta las variables en el entorno antes de arrancar.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mira}
    username: ${DB_USER:mira}
    password: ${DB_PASSWORD:mira}

  jpa:
    hibernate:
      ddl-auto: validate   # El esquema lo maneja Flyway, nunca Hibernate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  thymeleaf:
    cache: false

  # Documentos adjuntos (HU-23, D22): PDF, JPG o PNG de hasta 10 MB.
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  tomcat:
    # Tomcat lee el resto de un envío demasiado grande para poder responder con el aviso.
    max-swallow-size: 20MB

app:
  upload-dir: ${APP_UPLOAD_DIR:./uploads}

logging:
  level:
    cl.duoc.mira: DEBUG
