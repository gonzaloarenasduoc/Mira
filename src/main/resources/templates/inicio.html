<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Inicio')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
    <div class="encabezado-pagina mb-4">
        <h1 th:text="'Hola, ' + ${usuarioActual.nombreCompleto()}">Hola</h1>
        <p th:text="'Ingresaste como ' + ${#strings.toLowerCase(usuarioActual.rol().etiqueta)} + '. Estas son las opciones disponibles para tu rol.'">Opciones</p>
    </div>

    <div class="row g-3">
        <div class="col-md-6 col-lg-4" th:each="opcion : ${menu}" th:unless="${opcion.etiqueta() == 'Inicio'}">
            <a class="card h-100 acceso-rapido" th:href="@{${opcion.url()}}">
                <div class="card-body">
                    <div class="titulo mb-1" th:text="${opcion.etiqueta()}">Opción</div>
                    <div class="text-secondary small" th:switch="${opcion.etiqueta()}">
                        <span th:case="'Equipos'">Registro de cada equipo por número de serie, con su estado, bodega e historial.</span>
                        <span th:case="'Bodegas'">Bodegas de la empresa donde se asignan los equipos.</span>
                        <span th:case="'Usuarios'">Usuarios del sistema y el rol que determina a qué accede cada uno.</span>
                    </div>
                </div>
            </a>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: pie}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
