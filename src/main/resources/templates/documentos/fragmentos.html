<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  Tarjeta de documentos (HU-24 y HU-25). En la ficha de una operación no hace falta la columna de la
  operación; en la del equipo sí, porque reúne los documentos de todas sus operaciones (CF-13).
-->
<div th:fragment="tarjeta(documentos, conOperacion)" class="card">
    <div class="card-body">
        <h2 class="h6 text-uppercase text-secondary mb-3">Documentos</h2>
        <p class="text-secondary mb-0" th:if="${#lists.isEmpty(documentos)}"
           th:text="${conOperacion} ? 'Ninguna operación de este equipo tiene documentos adjuntos.' : 'Esta operación aún no tiene documentos adjuntos.'">Sin documentos</p>
        <div class="table-responsive" th:unless="${#lists.isEmpty(documentos)}">
            <table class="table align-middle mb-0 tabla-mira">
                <thead><tr><th>Fecha</th><th>Tipo</th><th>Número o folio</th><th th:if="${conOperacion}">Operación</th><th>Archivo</th></tr></thead>
                <tbody>
                <tr th:each="d : ${documentos}">
                    <td class="text-nowrap" th:text="${#temporals.format(d.fechaEmision(), 'dd-MM-yyyy')}">fecha</td>
                    <td th:text="${d.tipo().etiqueta}">Tipo</td>
                    <td th:text="${d.numeroFolio()}">folio</td>
                    <td class="text-nowrap" th:if="${conOperacion}">
                        <a th:if="${d.venta()}" th:href="@{/ventas/{id}(id=${d.operacionId()})}" th:text="'Venta N° ' + ${d.operacionId()}">Venta</a>
                        <a th:unless="${d.venta()}" th:href="@{/arriendos/{id}(id=${d.operacionId()})}" th:text="'Arriendo N° ' + ${d.operacionId()}">Arriendo</a>
                    </td>
                    <td>
                        <a th:href="@{/documentos/{id}/archivo(id=${d.id()})}" th:text="${d.nombreArchivo()}">archivo</a>
                        <span class="small text-secondary" th:text="'(' + ${#numbers.formatDecimal(d.tamanoBytes() / 1024.0, 1, 'POINT', 0, 'COMMA')} + ' KB)'">(KB)</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
