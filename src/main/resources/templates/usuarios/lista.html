<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Usuarios')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
    <div class="encabezado-pagina d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <div>
            <h1>Usuarios</h1>
            <p>Personas con acceso al sistema y el rol de cada una.</p>
        </div>
        <a class="btn btn-primary" th:href="@{/usuarios/nuevo}">Nuevo usuario</a>
    </div>

    <div th:replace="~{fragments/layout :: mensajes}"></div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0 tabla-mira">
                <thead>
                <tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Estado</th><th class="text-end">Acciones</th></tr>
                </thead>
                <tbody>
                <tr th:each="u : ${usuarios}">
                    <td th:text="${u.nombreCompleto()}">Nombre</td>
                    <td th:text="${u.email()}">correo</td>
                    <td th:text="${u.rol().etiqueta}">Rol</td>
                    <td>
                        <span class="estado estado-DISPONIBLE" th:if="${u.activo()}">Activo</span>
                        <span class="estado estado-VENDIDO" th:unless="${u.activo()}">Inactivo</span>
                    </td>
                    <td class="text-end text-nowrap">
                        <a class="btn btn-sm btn-outline-primary" th:href="@{/usuarios/{id}/editar(id=${u.id()})}">Editar</a>
                        <form class="d-inline" method="post" th:if="${u.activo() and u.id() != usuarioActual.id()}"
                              th:action="@{/usuarios/{id}/desactivar(id=${u.id()})}">
                            <button class="btn btn-sm btn-outline-danger" type="submit">Desactivar</button>
                        </form>
                        <form class="d-inline" method="post" th:unless="${u.activo()}"
                              th:action="@{/usuarios/{id}/activar(id=${u.id()})}">
                            <button class="btn btn-sm btn-outline-success" type="submit">Activar</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: pie}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
