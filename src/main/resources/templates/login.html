<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Iniciar sesión')}"></head>
<body class="login-fondo">
<main class="container d-flex align-items-center justify-content-center py-5">
    <div class="card w-100" style="max-width: 420px;">
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
                <img th:src="@{/img/mira.svg}" width="56" height="56" alt="">
                <h1 class="h4 mt-3 mb-1 fw-semibold" style="color: var(--mira-azul);">Mira</h1>
                <p class="text-secondary small mb-0">Gestión y trazabilidad de equipos de geomensura</p>
            </div>

            <div class="alert alert-danger small" role="alert" th:if="${param.error}">
                Correo o contraseña incorrectos.
            </div>
            <div class="alert alert-success small" role="status" th:if="${param.salir}">
                Sesión cerrada correctamente.
            </div>

            <form th:action="@{/login}" method="post" novalidate>
                <div class="mb-3">
                    <label for="username" class="form-label">Correo</label>
                    <input type="email" id="username" name="username" class="form-control"
                           autocomplete="username" required autofocus>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" id="password" name="password" class="form-control"
                           autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Iniciar sesión</button>
            </form>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
